<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff8a3d">
  <title>개인정보처리방침 - carrotymap</title>
  <style>
    :root { --accent: #ff8a3d; --text: #333; --muted: #888; --bg: #fff; }
    @media (prefers-color-scheme: dark) { :root { --text: #eee; --muted: #999; --bg: #1c1c1e; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; line-height: 1.7; }
    header { background: var(--accent); padding: 14px 16px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
    main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 20px; }
    .empty { color: var(--muted); border: 1px dashed var(--muted); border-radius: 8px; padding: 40px 16px; text-align: center; }
  </style>
</head>
<body>
  <header><a href="/main">carrotymap</a></header>
  <main>
    <h1>개인정보처리방침</h1>
    <!-- 내용은 아래 칸에 적는다 -->
    <div class="empty">내용을 준비하고 있습니다.</div>
  </main>
</body>
</html>
