<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>밝은미래 물류 - 회사 소개</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="company_detail.css">
</head>
<body>
  <div class="top-bar">
    <a href="../../main">&larr; 지도로 돌아가기</a>
  </div>

  <div class="page">
    <div class="hero">
      <div class="hero__logo" style="background:#2f7d4f;">물류</div>
      <div class="hero__title">
        <h1>밝은미래 물류</h1>
        <span class="badge">교통 · 운송/물류</span>
      </div>
    </div>

    <div class="card">
      <h2>소개</h2>
      <p class="desc">
        밝은미래 물류는 수도권 북부 지역을 중심으로 당일·익일 배송 서비스를 제공하는
        운송 전문 기업입니다. 소형 택배부터 팔레트 단위 화물까지 다양한 규모의
        물류 수요에 대응하고 있습니다.
      </p>
    </div>

    <div class="card">
      <h2>연락처</h2>
      <ul class="contact-list">
        <li><span class="icon">📞</span> <a href="tel:031-345-6789">031-345-6789</a></li>
        <li><span class="icon">✉️</span> <a href="mailto:info@brightfuture-logis.kr">info@brightfuture-logis.kr</a></li>
        <li><span class="icon">🌐</span> <a href="#" target="_blank" rel="noopener">www.brightfuture-logis.kr</a></li>
      </ul>
    </div>

    <div class="card">
      <h2>위치</h2>
      <div id="map"></div>
      <p class="address">경기도 의정부시 물류로 88 (가상 주소 · 샘플용)</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false, attributionControl: false })
      .setView([37.7350, 127.0552], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([37.7350, 127.0552]).addTo(map);
  </script>
</body>
</html>
