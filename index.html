    <!-- 우측 지도 영역: Leaflet 지도만 띄운다 (마커/검색 연동은 아직 없음) -->
    <div class="map-area">
      <div id="map"></div>

      <!-- 지도 위 광고 배너 (3초 간격 자동 전환) -->
      <div class="map-ad-banner" id="map-ad-banner">
        <span class="map-ad-banner__tag">AD</span>

      </div>

      <button type="button" id="locate-btn" class="map-area__locate" title="내 위치">⊙</button>

      <div class="map-area__zoom">

        <button type="button">-</button>
      </div>

      <!-- 음식사진/웃긴사진: 지도 대신 이 영역을 덮어서 보여 준다 (왼쪽 슬라이드는 그대로) -->

        <div class="gallery-area__head">
          <h2 id="gallery-title"></h2>
          <p id="gallery-desc"></p>
          <button type="button" id="gallery-admin-btn" class="gallery-admin-btn">🔒 관리</button>
        </div>
        <div id="gallery-upload" class="gallery-upload" hidden>
          <label class="gallery-upload__drop" id="gallery-drop">
            사진을 여기에 끌어다 놓거나 눌러서 고르세요 (여러 장 가능, 한 장당 10MB까지)
            <input type="file" id="gallery-file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
          </label>
          <div id="gallery-status" class="gallery-upload__status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, layerControl;
    // ===== 지도 배경 =====
    // CARTO 밝은/어두운 지도는 2026-10부터 API 키를 요구해서("API KEY REQUIRED") 뺐다.
    // 키가 필요 없는 OpenStreetMap 기본 지도만 쓴다.
    const baseMaps = {
      "기본 지도": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap", maxZoom: 19,
      }),
    };

    // 지도 시작 위치/줌은 서버(map_config.json)에서 먼저 가져온 뒤 지도를 만든다.
    // (전체 장소 목록은 노션을 거쳐 느리게 오므로, 그걸 기다리면 초기 위치가
    // 잠깐 엉뚱한 곳(기본값)에 머물렀다 이동하는 게 보이게 된다.)
    async function initMap() {
      let mapConfig = { lat: 37.738060, lon: 127.046110, zoom: 13 };
      try {
        const res = await fetch("/api/map-config");
        if (res.ok) mapConfig = await res.json();
      } catch (e) {
        console.warn("지도 설정을 불러오지 못했습니다.", e);
      }

      map = L.map("map", { zoomControl: false, attributionControl: false })
        .setView([mapConfig.lat, mapConfig.lon], mapConfig.zoom);
      baseMaps["기본 지도"].addTo(map);
      // 배경/경계 토글을 모아 보여줄 레이어 컨트롤 (버튼 하나, 클릭하면 펼쳐짐).
      layerControl = L.control.layers(baseMaps, {}, { collapsed: true, position: "topright" }).addTo(map);
      // 기본 위치(우하단)가 우리 커스텀 확대/축소 버튼과 겹쳐서 왼쪽 아래로 옮긴다.
      L.control.attribution({ position: "bottomleft" }).addTo(map);

      document.querySelectorAll(".map-area__zoom button")[0]
        .addEventListener("click", function () { map.zoomIn(); });
      document.querySelectorAll(".map-area__zoom button")[1]
        .addEventListener("click", function () { map.zoomOut(); });

      const locateBtn = document.getElementById("locate-btn");
      let myLocationMarker = null;
      let myLocationAccuracyCircle = null;
      let locateWatchId = null;

      function updateLocationMarker(pos, isFinal) {
        const lat = pos.coords.latitude, lon = pos.coords.longitude, accuracy = pos.coords.accuracy;
        if (myLocationMarker) map.removeLayer(myLocationMarker);
        if (myLocationAccuracyCircle) map.removeLayer(myLocationAccuracyCircle);

        myLocationAccuracyCircle = L.circle([lat, lon], {
          radius: accuracy, color: "#1a73e8", weight: 1, fillColor: "#4285f4", fillOpacity: 0.12,
        }).addTo(map);
        myLocationMarker = L.circleMarker([lat, lon], {
          radius: 8, color: "#1a73e8", weight: 2, fillColor: "#4285f4", fillOpacity: 0.9,
        }).addTo(map);

        const accuracyText = "오차 약 " + Math.round(accuracy) + "m";
        myLocationMarker.bindPopup(
          "현재 위치 (" + accuracyText + ")" +
          (isFinal && accuracy > 100 ? "<br>GPS가 없는 기기(PC 등)는 정확도가 낮을 수 있어요." : "")
        );
        if (isFinal) myLocationMarker.openPopup();
        return accuracy;
      }

      locateBtn.addEventListener("click", function () {
        if (!navigator.geolocation) {
          alert("이 브라우저는 위치 정보를 지원하지 않습니다.");
          return;
        }
        if (locateWatchId !== null) navigator.geolocation.clearWatch(locateWatchId);

        locateBtn.disabled = true;
        let bestAccuracy = Infinity;
        let bestPos = null;
        let gotFirstFix = false;
        const REFINE_DURATION_MS = 8000;

        locateWatchId = navigator.geolocation.watchPosition(
          function (pos) {
            if (!gotFirstFix) {
              gotFirstFix = true;
              map.flyTo([pos.coords.latitude, pos.coords.longitude], 17, { duration: 0.85 });
            }
            if (pos.coords.accuracy <= bestAccuracy) {
              bestAccuracy = pos.coords.accuracy;
              bestPos = pos;
              updateLocationMarker(pos, false);
            }
          },
          function (err) {
            locateBtn.disabled = false;
            if (locateWatchId !== null) { navigator.geolocation.clearWatch(locateWatchId); locateWatchId = null; }
            alert("위치 정보를 가져오지 못했습니다: " + err.message);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );

        setTimeout(function () {
          locateBtn.disabled = false;
          if (locateWatchId !== null) { navigator.geolocation.clearWatch(locateWatchId); locateWatchId = null; }
          if (bestPos) updateLocationMarker(bestPos, true);
        }, REFINE_DURATION_MS);
      });

      setupBoundaries();
      loadPlaces();
    }

    // 탭 버튼을 누르면 active 표시를 옮기고, 해당 패널을 바로 보여준다 (애니메이션 없음).
    const tabButtons = document.querySelectorAll(".sidebar__tabs button");
    const panels = document.querySelectorAll(".sidebar__panel");

    function switchPanel(targetId) {
      tabButtons.forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-panel") === targetId);
      });
      panels.forEach(function (panel) {
        panel.classList.toggle("active", panel.id === targetId);
      });
    }

    tabButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        switchPanel(btn.getAttribute("data-panel"));
      });
    });

    // 로고를 누르면 검색 탭으로 이동한다.
    const sidebarLogo = document.getElementById("sidebar-logo");
    sidebarLogo.addEventListener("click", function () { switchPanel("panel-search"); });
    sidebarLogo.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchPanel("panel-search"); }
    });

    // ===== 마커 데이터 연동 (회사 DB / 핫플 DB) =====
    const ICON_DIR = "/static/ico/pack_2";
    const hotspotIconFiles = {
      "볼 거리": "01_see.png", "알아갈 거리": "02_learn.png", "마실 거리": "03_drink.png",
      "먹을 거리": "04_eat.png", "즐길 거리": "05_play.png", "쉴 거리": "06_rest.png",
      "숙소": "07_stay.png", "교통": "08_move.png",
      "산": "10_mountain.png", "바다": "11_sea.png", "조선 왕릉": "12_royal_tomb.png", "역사 인물 묘": "13_grave.png", "문화재": "14_heritage.png",
      "기타": "09_other.png",
    };
    const companyIconEmoji = {
      "서버SW": "🖥️", "펌웨어": "💾", "회로설계": "🔌", "PCB 아트웍/제작": "🖊️",
      "SMT / 조립 / 하네스": "🔧", "부품 유통": "📦", "기구설계 / CNC": "🛠️",
      "계측 / 시험 / 인증": "📏", "기타": "➕",
    };
    // 카테고리 버튼 라벨(공백 없음) → 노션 카테고리 값(공백 있음) 대응.
    const companyLabelToCategory = {
      "SMT/조립/하네스": "SMT / 조립 / 하네스",
      "기구설계/CNC": "기구설계 / CNC",
      "계측/시험/인증": "계측 / 시험 / 인증",
    };

    function escapeHtml(s) {
      return String(s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function makeIcon(domain, category) {
      if (domain === "company") {
        const emoji = companyIconEmoji[category] || companyIconEmoji["기타"];
        return L.divIcon({
          html: '<span class="company-marker-emoji">' + emoji + "</span>",
          className: "company-marker-icon",
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -12],
        });
      }
      const file = hotspotIconFiles[category] || hotspotIconFiles["기타"];
      return L.icon({
        iconUrl: ICON_DIR + "/" + file,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -12],
      });
    }

    // groups[domain][category] = L.layerGroup()
    const groups = {};
    // categoryButtonMap[domain][category] = button element (카테고리 버튼 on/off 상태 참조용)
    const categoryButtonMap = {};
    // 검색용 평면 목록: { id, name, address, category, domain, lat, lon, marker, group, url }
    const placeIndex = [];
    // 태그 필터("의정부 명소" 같은 태그를 검색하면 그 태그가 붙은 장소만 지도에 남긴다). 칩의 ✕를 누를 때까지 유지한다.
    let tagFilter = null; // { tag, saved: [[button, 꺼져 있었는지], ...] }
    function itemHasTag(item, tag) {
      const t = normalize(tag);
      return (item.tags || []).some(function (x) { return normalize(x) === t; });
    }

    // ===== 즐겨찾기 (localStorage) =====
    const FAVORITES_KEY = "carroty_favorites";
    let favorites = [];
    try {
      favorites = JSON.parse(localStorage.getItem(FAVORITES_KEY) || "[]");
    } catch (err) {
      favorites = [];
    }
    // 저장된 값이 배열이 아니거나 항목이 이상해도 화면이 멈추지 않게 걸러 낸다.
    if (!Array.isArray(favorites)) favorites = [];
    favorites = favorites.filter(function (f) { return f && typeof f === "object" && f.id; });

    function makePlaceId(p) {
      return p.domain + "|" + p.name + "|" + p.address;
    }

    function isFavorite(id) {
      return favorites.some(function (f) { return f.id === id; });
    }

    function saveFavorites() {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
    }

    function toggleFavorite(item) {
      if (isFavorite(item.id)) {
        favorites = favorites.filter(function (f) { return f.id !== item.id; });
      } else {
        // marker/group 같은 Leaflet 객체는 저장하지 않고 필요한 값만 뽑아서 저장한다.
        favorites.push({
          id: item.id, name: item.name, address: item.address, category: item.category,
          domain: item.domain, lat: item.lat, lon: item.lon, url: item.url || "",
        });
      }
      saveFavorites();
      syncFavoriteButtons(item.id);
      renderFavoritesPanel();
    }

    function syncFavoriteButtons(id) {
      const fav = isFavorite(id);
      document.querySelectorAll("[data-fav-id]").forEach(function (btn) {
        if (btn.getAttribute("data-fav-id") !== id) return;
        btn.textContent = fav ? "★" : "☆";
        btn.classList.toggle("is-favorite", fav);
      });
    }

    function favStarHtml(id) {
      const fav = isFavorite(id);
      return '<button type="button" class="fav-star' + (fav ? " is-favorite" : "") +
        '" data-fav-id="' + escapeHtml(id) + '" title="즐겨찾기">' + (fav ? "★" : "☆") + "</button>";
    }

    function updateTabCount(id, label, count) {
      const btn = document.getElementById(id);
      if (btn) btn.textContent = label + " (" + count + ")";
    }

    function renderFavoritesPanel() {
      updateTabCount("tab-favorite", "즐겨찾기", favorites.length);
      const el = document.getElementById("favorite-list");
      if (!el) return;
      el.innerHTML = "";
      if (!favorites.length) {
        const li = document.createElement("li");
        li.className = "sidebar__list-empty";
        li.textContent = "즐겨찾기한 장소가 없습니다.";
        el.appendChild(li);
        return;
      }
      favorites.forEach(function (item) {
        const li = document.createElement("li");
        li.className = "sidebar__list-item";
        li.innerHTML =
          '<div class="sidebar__list-item-row">' +
            '<span class="sidebar__list-item-name">' + escapeHtml(item.name) + "</span>" +
            favStarHtml(item.id) +
          "</div>" +
          '<span class="sidebar__list-item-addr">' + '<b class="sidebar__list-item-domain sidebar__list-item-domain--' + item.domain + '">' + (item.domain === "company" ? "회사" : "핫플") + "</b> " +
            escapeHtml(item.category) + " · " + escapeHtml(item.address) + "</span>" +
          (item.url ? '<a class="sidebar__list-item-link" href="' + escapeHtml(item.url) +
            '" target="_blank" rel="noopener">자세히 보기</a>' : "");
        const star = li.querySelector(".fav-star");
        star.addEventListener("click", function (e) { e.stopPropagation(); toggleFavorite(item); });
        const link = li.querySelector(".sidebar__list-item-link");
        if (link) link.addEventListener("click", function (e) { e.stopPropagation(); });
        li.addEventListener("click", function () {
          const found = placeIndex.find(function (p) { return p.id === item.id; });
          if (found) {
            goToPlace(found);
          } else {
            map.flyTo([item.lat, item.lon], 17, { duration: 0.85 });
          }
        });
        el.appendChild(li);
      });
    }

    function ensureGroup(domain, category) {
      if (!groups[domain]) groups[domain] = {};
      if (!groups[domain][category]) groups[domain][category] = L.layerGroup();
      return groups[domain][category];
    }

    function applyDomainVisibility(domain) {
      Object.keys(groups).forEach(function (d) {
        Object.keys(groups[d]).forEach(function (cat) {
          const g = groups[d][cat];
          if (map.hasLayer(g)) map.removeLayer(g);
        });
      });
      if (!groups[domain]) return;
      Object.keys(groups[domain]).forEach(function (cat) {
        const btn = categoryButtonMap[domain] && categoryButtonMap[domain][cat];
        if (btn && btn.classList.contains("is-off")) return;
        map.addLayer(groups[domain][cat]);
      });
    }

    function addPlaceMarker(p) {
      const group = ensureGroup(p.domain, p.category);
      const marker = L.marker([p.lat, p.lon], {
        icon: makeIcon(p.domain, p.category),
        title: p.name,
      });
      const item = {
        id: makePlaceId(p), name: p.name, address: p.address || "", category: p.category,
        domain: p.domain, lat: p.lat, lon: p.lon, marker: marker, group: group, url: p.url || "",
        tags: Array.isArray(p.tags) ? p.tags : [],
      };
      marker.bindPopup(
        '<div class="company-popup">' +
          '<div class="company-popup__row"><b>' + escapeHtml(p.name) + "</b>" + favStarHtml(item.id) + "</div>" +
          escapeHtml(p.category) + "<br/>" +
          escapeHtml(p.address || "") +
          (p.url ? '<br/><a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener">자세히 보기</a>' : "") +
        "</div>"
      );
      marker.on("popupopen", function (e) {
        const popupEl = e.popup.getElement();
        const star = popupEl && popupEl.querySelector(".fav-star");
        if (star) star.addEventListener("click", function (ev) {
          ev.stopPropagation();
          toggleFavorite(item);
        });
      });
      if (!tagFilter || itemHasTag(item, tagFilter.tag)) marker.addTo(group);
      placeIndex.push(item);
      return item;
    }

    async function loadPlaces() {
      let data;
      try {
        const res = await fetch("/api/places");
        data = await res.json();
      } catch (err) {
        console.error("장소 데이터를 불러오지 못했습니다.", err);
        return;
      }
      (data.places || []).forEach(function (p) { addPlaceMarker(p); });
      applyDomainVisibility(activeDomain);
      updateRegisterTabCount();
    }

    // 검색 패널 안의 핫플/회사 토글: 아래 카테고리 아이콘 세트 + 지도 위 마커를 함께 바꾼다.
    const domainButtons = document.querySelectorAll("#search-domain-toggle button[data-domain]");
    const categoryGroups = document.querySelectorAll(".sidebar__categories");
    let activeDomain = document.querySelector("#search-domain-toggle button.active[data-domain]").getAttribute("data-domain");

    // 음식사진/웃긴사진: 지도 대신 갤러리를 보여 준다. 왼쪽 슬라이드(토글 줄)는 그대로 남는다.
    const galleryButtons = document.querySelectorAll("#photo-toggle button[data-gallery]");
    const galleryArea = document.getElementById("gallery-area");
    const galleryGrid = document.getElementById("gallery-grid");
    const sidebarListEls = [document.getElementById("place-list-title"), document.getElementById("place-list")];

    const photoTab = document.getElementById("photo-tab");
    const photoToggle = document.getElementById("photo-toggle");
    let lastPhotoKind = "food";

    function leaveGallery() {
      photoTab.classList.remove("active");
      photoToggle.hidden = true;
      galleryArea.hidden = true;
      galleryButtons.forEach(function (b) { b.classList.remove("active"); });
      sidebarListEls.forEach(function (el) { el.hidden = false; });
    }

    // 관리(업로드/삭제): 비밀번호를 한 번 입력하면 이 브라우저에 기억한다.
    const adminBtn = document.getElementById("gallery-admin-btn");
    const uploadBox = document.getElementById("gallery-upload");
    const galleryStatus = document.getElementById("gallery-status");
    let currentKind = null;
    let adminPassword = "";
    try { adminPassword = localStorage.getItem("photoAdminPw") || ""; } catch (e) {}
    let isAdmin = false;

    function setAdmin(on) {
      isAdmin = on;
      uploadBox.hidden = !on;
      adminBtn.textContent = on ? "🔓 관리 끄기" : "🔒 관리";
      if (currentKind) loadGallery(currentKind);
    }

    function checkAdmin(pw) {
      return fetch("/api/photos/auth", { method: "POST", headers: { "X-Upload-Password": pw } })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, error: j.error }; }); });
    }

    adminBtn.addEventListener("click", function () {
      if (isAdmin) {
        adminPassword = "";
        try { localStorage.removeItem("photoAdminPw"); } catch (e) {}
        setAdmin(false);
        return;
      }
      const pw = window.prompt("관리 비밀번호를 입력하세요");
      if (!pw) return;
      checkAdmin(pw).then(function (res) {
        if (!res.ok) { window.alert(res.error || "비밀번호가 맞지 않습니다."); return; }
        adminPassword = pw;
        try { localStorage.setItem("photoAdminPw", pw); } catch (e) {}
        setAdmin(true);
      });
    });

    if (adminPassword) {
      checkAdmin(adminPassword).then(function (res) {
        if (res.ok) { isAdmin = true; uploadBox.hidden = false; adminBtn.textContent = "🔓 관리 끄기"; }
        else { adminPassword = ""; try { localStorage.removeItem("photoAdminPw"); } catch (e) {} }
      }).catch(function () {});
    }

    function uploadFiles(files) {
      if (!currentKind || !files.length) return;
      const fd = new FormData();
      Array.prototype.forEach.call(files, function (f) { fd.append("files", f); });
      galleryStatus.textContent = files.length + "장 올리는 중...";
      fetch("/api/photos/" + encodeURIComponent(currentKind) + "/upload", {
        method: "POST", headers: { "X-Upload-Password": adminPassword }, body: fd,
      }).then(function (r) {
        if (r.status === 413) throw new Error("한 번에 올리는 크기가 너무 큽니다. 나눠서 올려 주세요.");
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "업로드 실패"); return j; });
      }).then(function (j) {
        const msg = [j.saved.length + "장 올렸습니다."].concat(j.errors);
        galleryStatus.textContent = msg.join(" ");
        loadGallery(currentKind);
      }).catch(function (e) { galleryStatus.textContent = e.message; });
    }

    const dropZone = document.getElementById("gallery-drop");
    const fileInput = document.getElementById("gallery-file");
    fileInput.addEventListener("change", function () { uploadFiles(fileInput.files); fileInput.value = ""; });
    ["dragenter", "dragover"].forEach(function (ev) {
      galleryArea.addEventListener(ev, function (e) {
        if (!isAdmin) return;
        e.preventDefault(); dropZone.classList.add("is-over");
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      galleryArea.addEventListener(ev, function () { dropZone.classList.remove("is-over"); });
    });
    galleryArea.addEventListener("drop", function (e) {
      if (!isAdmin) return;
      e.preventDefault();
      uploadFiles(e.dataTransfer.files);
    });

    function deletePhoto(p) {
      if (!window.confirm("'" + p.label + "' 사진을 삭제할까요? 되돌릴 수 없습니다.")) return;
      fetch("/api/photos/" + encodeURIComponent(currentKind) + "/" + encodeURIComponent(p.filename), {
        method: "DELETE", headers: { "X-Upload-Password": adminPassword },
      }).then(function (r) {
        if (!r.ok) throw new Error("삭제하지 못했습니다.");
        galleryStatus.textContent = "'" + p.label + "' 삭제했습니다.";
        loadGallery(currentKind);
      }).catch(function (e) { galleryStatus.textContent = e.message; });
    }

    // 이름을 누르면 입력칸으로 바뀐다. Enter 또는 칸 밖을 누르면 저장, Esc는 취소.
    function editPhotoName(p, nameEl) {
      if (nameEl.querySelector("input")) return;
      const input = document.createElement("input");
      input.type = "text"; input.className = "gallery-card__name-input";
      input.value = p.label; input.maxLength = 60;
      nameEl.textContent = "";
      nameEl.appendChild(input);
      input.focus(); input.select();
      let done = false;
      function finish(save) {
        if (done) return;
        done = true;
        const value = input.value.trim();
        if (!save || !value || value === p.label) { nameEl.textContent = p.label; return; }
        fetch("/api/photos/" + encodeURIComponent(currentKind) + "/" + encodeURIComponent(p.filename), {
          method: "PATCH",
          headers: { "X-Upload-Password": adminPassword, "Content-Type": "application/json" },
          body: JSON.stringify({ name: value }),
        }).then(function (r) {
          return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "이름을 바꾸지 못했습니다."); return j; });
        }).then(function (j) {
          galleryStatus.textContent = "'" + p.label + "' -> '" + j.label + "' 이름을 바꿨습니다.";
          loadGallery(currentKind);
        }).catch(function (e) {
          galleryStatus.textContent = e.message;
          nameEl.textContent = p.label;
        });
      }
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { finish(false); }
      });
      input.addEventListener("blur", function () { finish(true); });
    }

    // 클립보드 복사: HTTPS가 아니거나 권한이 없으면 옛 방식(textarea)으로 한 번 더 시도한다
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      });
    }

    // 사진을 PNG Blob으로 바꾼다(클립보드는 PNG만 안정적으로 받는다). GIF는 첫 장면만 들어간다.
    function photoAsPng(url) {
      return fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
        if (blob.type === "image/png") return blob;
        return createImageBitmap(blob).then(function (bmp) {
          const c = document.createElement("canvas");
          c.width = bmp.width; c.height = bmp.height;
          c.getContext("2d").drawImage(bmp, 0, 0);
          return new Promise(function (resolve, reject) {
            c.toBlob(function (b) { b ? resolve(b) : reject(new Error("png")); }, "image/png");
          });
        });
      });
    }

    // 태그 필터: "" = 전체(조의 태그가 붙은 사진은 숨김), 태그를 고르면 그 태그의 사진만 보임
    let currentTag = "";
    const galleryTagsEl = document.getElementById("gallery-tags");
    const HIDDEN_BY_DEFAULT = "조의";

    function putTags(p, tags) {
      return fetch("/api/photos/" + encodeURIComponent(currentKind) + "/" + encodeURIComponent(p.filename) + "/tags", {
        method: "PUT",
        headers: { "X-Upload-Password": adminPassword, "Content-Type": "application/json" },
        body: JSON.stringify({ tags: tags }),
      }).then(function (r) {
        return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "태그를 저장하지 못했습니다."); return j; });
      });
    }

    function loadGallery(kind) {
      fetch("/api/photos/" + encodeURIComponent(kind))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          document.getElementById("gallery-title").textContent = data.title;
          document.getElementById("gallery-desc").textContent = data.desc + " - 이미지를 복사하거나 내려받으세요.";
          galleryGrid.innerHTML = "";
          const allTags = data.tags || [];
          const used = {};
          data.photos.forEach(function (p) { (p.tags || []).forEach(function (t) { used[t] = (used[t] || 0) + 1; }); });
          // 태그 줄: 이 갤러리에 태그가 붙은 사진이 있거나 관리 중일 때만 보인다
          galleryTagsEl.innerHTML = "";
          const hasTags = Object.keys(used).length > 0;
          galleryTagsEl.hidden = !(hasTags || isAdmin);
          if (currentTag && !used[currentTag]) currentTag = "";
          if (!galleryTagsEl.hidden) {
            [""].concat(allTags).forEach(function (t) {
              if (t && !used[t] && !isAdmin) return;
              const b = document.createElement("button");
              b.type = "button";
              b.textContent = t ? t + (used[t] ? " " + used[t] : "") : "전체";
              if (!t) b.title = "'" + HIDDEN_BY_DEFAULT + "' 태그가 붙은 사진은 여기서 숨겨져 있고 '" + HIDDEN_BY_DEFAULT + "'을 눌러야 보입니다";
              if (t === currentTag) b.classList.add("active");
              b.addEventListener("click", function () { currentTag = t; loadGallery(kind); });
              galleryTagsEl.appendChild(b);
            });
          }
          const photos = data.photos.filter(function (p) {
            const tg = p.tags || [];
            return currentTag ? tg.indexOf(currentTag) >= 0 : tg.indexOf(HIDDEN_BY_DEFAULT) < 0;
          });
          if (!photos.length) {
            const empty = document.createElement("div");
            empty.className = "gallery-empty";
            empty.textContent = isAdmin
              ? "아직 사진이 없습니다. 위에서 사진을 올려 보세요."
              : "아직 사진이 없습니다.";
            galleryGrid.appendChild(empty);
            return;
          }
          photos.forEach(function (p) {
            const card = document.createElement("div");
            card.className = "gallery-card";
            const img = document.createElement("img");
            img.src = p.thumb || p.url; img.alt = p.label; img.loading = "lazy";
            // 작은 미리보기를 누르면 원본을 새 탭에서 연다
            const imgLink = document.createElement("a");
            imgLink.href = p.url; imgLink.target = "_blank"; imgLink.rel = "noopener";
            imgLink.appendChild(img);
            const name = document.createElement("div");
            name.className = "gallery-card__name"; name.textContent = p.label;
            if (isAdmin) {
              name.classList.add("is-editable");
              name.title = "눌러서 이름 바꾸기";
              name.addEventListener("click", function () { editPhotoName(p, name); });
            }
            const dl = document.createElement("a");
            dl.className = "gallery-card__dl"; dl.href = p.url; dl.setAttribute("download", p.filename);
            dl.textContent = "내려받기";
            const actions = document.createElement("div");
            actions.className = "gallery-card__actions";
            const fullUrl = new URL(p.url, location.href).href;
            function flash(btn, text, ok) {
              const orig = btn.getAttribute("data-label");
              btn.textContent = text;
              setTimeout(function () { btn.textContent = orig; }, ok ? 1500 : 2500);
            }
            function mkBtn(label) {
              const b = document.createElement("button");
              b.type = "button"; b.className = "gallery-card__copy"; b.textContent = label;
              b.setAttribute("data-label", label);
              return b;
            }
            // 이미지 복사: 사진 자체를 클립보드에 넣는다(채팅창에 붙여넣으면 이미지로 올라감)
            const canCopyImage = !!(window.ClipboardItem && navigator.clipboard && window.isSecureContext);
            if (canCopyImage) {
              const imgBtn = mkBtn("이미지 복사");
              imgBtn.addEventListener("click", function () {
                imgBtn.textContent = "복사 중...";
                // Safari는 클릭 직후에 ClipboardItem을 만들어야 해서 Promise를 그대로 넘긴다
                const item = new ClipboardItem({ "image/png": photoAsPng(p.url) });
                navigator.clipboard.write([item]).then(function () {
                  flash(imgBtn, "복사됨 ✓", true);
                }, function () {
                  flash(imgBtn, "복사 실패", false);
                });
              });
              actions.appendChild(imgBtn);
            }
            // 링크 복사는 이미지 복사가 안 되는 환경에서만 대신 보여 준다(카톡은 링크만으로는 이미지를 보여 주지 않음)
            if (!canCopyImage) {
              const copyBtn = mkBtn("링크 복사");
              copyBtn.addEventListener("click", function () {
                copyText(fullUrl).then(function () {
                  flash(copyBtn, "복사됨 ✓", true);
                }, function () {
                  window.prompt("아래 주소를 복사하세요", fullUrl);
                });
              });
              actions.appendChild(copyBtn);
            }
            if (navigator.share) {
              const shareBtn = mkBtn("공유");
              shareBtn.addEventListener("click", function () {
                // 가능하면 사진 파일 자체를 공유(카톡에 이미지로 올라감), 안 되면 주소만 공유
                fetch(p.url).then(function (r) { return r.blob(); }).then(function (blob) {
                  const file = new File([blob], p.filename, { type: blob.type || "image/jpeg" });
                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    return navigator.share({ files: [file], title: p.label });
                  }
                  return navigator.share({ title: p.label, url: fullUrl });
                }).catch(function (e) {
                  if (e && e.name === "AbortError") return;
                  navigator.share({ title: p.label, url: fullUrl }).catch(function () {});
                });
              });
              actions.appendChild(shareBtn);
            }
            actions.appendChild(dl);
            // 태그: 누구에게나 붙은 태그가 보이고, 관리 중이면 눌러서 켜고 끈다
            const tagRow = document.createElement("div");
            tagRow.className = "gallery-card__tags";
            p.tags = p.tags || [];
            allTags.forEach(function (t) {
              if (!isAdmin && p.tags.indexOf(t) < 0) return;
              const tb = document.createElement(isAdmin ? "button" : "span");
              tb.textContent = t;
              tb.className = "gallery-tag" + (p.tags.indexOf(t) >= 0 ? " on" : "");
              if (isAdmin) {
                tb.type = "button";
                tb.addEventListener("click", function () {
                  const next = p.tags.indexOf(t) >= 0 ? p.tags.filter(function (x) { return x !== t; }) : p.tags.concat([t]);
                  putTags(p, next).then(function (j) {
                    p.tags = j.tags;
                    tb.classList.toggle("on", p.tags.indexOf(t) >= 0);
                  }).catch(function (e) { galleryStatus.textContent = e.message; });
                });
              }
              tagRow.appendChild(tb);
            });
            card.appendChild(imgLink); card.appendChild(name);
            if (tagRow.children.length) card.appendChild(tagRow);
            card.appendChild(actions);
            if (isAdmin) {
              const del = document.createElement("button");
              del.type = "button"; del.className = "gallery-card__del"; del.textContent = "삭제";
              del.addEventListener("click", function () { deletePhoto(p); });
              card.appendChild(del);
            }
            galleryGrid.appendChild(card);
          });
        })
        .catch(function () {
          galleryGrid.innerHTML = '<div class="gallery-empty">사진 목록을 불러오지 못했습니다.</div>';
        });
    }

    function showGallery(kind) {
      if (currentKind !== kind) currentTag = "";
      currentKind = kind;
      lastPhotoKind = kind;
      photoTab.classList.add("active");
      photoToggle.hidden = false;
      galleryStatus.textContent = "";
      domainButtons.forEach(function (b) { b.classList.remove("active"); });
      galleryButtons.forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-gallery") === kind);
      });
      categoryGroups.forEach(function (group) { group.hidden = true; });
      sidebarListEls.forEach(function (el) { el.hidden = true; });
      galleryArea.hidden = false;
      galleryGrid.innerHTML = "";
      loadGallery(kind);
    }

    galleryButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        showGallery(btn.getAttribute("data-gallery"));
        if (window.matchMedia("(max-width: 768px)").matches) {
          document.body.classList.add("sidebar-collapsed");
        }
        history.replaceState(null, "", "#photos-" + btn.getAttribute("data-gallery"));
      });
    });

    // 맨 위 "사진" 탭: 마지막에 보던 종류(처음엔 음식)를 연다. 사이드바는 닫지 않아 아래 종류 줄을 고를 수 있다.
    photoTab.addEventListener("click", function () {
      showGallery(lastPhotoKind);
      history.replaceState(null, "", "#photos-" + lastPhotoKind);
    });

    // 영역(회사/핫플) 전환. 검색 결과에서 다른 영역의 장소를 고를 때도 쓴다(keepSearch=true면 검색 목록을 지우지 않는다).
    function setDomain(domain, keepSearch) {
      leaveGallery();
      history.replaceState(null, "", location.pathname + location.search);
      domainButtons.forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-domain") === domain);
      });
      activeDomain = domain;
      categoryGroups.forEach(function (group) {
        group.hidden = group.getAttribute("data-domain") !== domain;
      });
      applyDomainVisibility(domain);
      if (!keepSearch) clearSearchResults();
    }

    domainButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        setDomain(btn.getAttribute("data-domain"), false);
      });
    });

    // 카테고리 아이콘 버튼: 클릭하면 해당 카테고리 마커만 켜고 끈다.
    categoryGroups.forEach(function (panel) {
      const domain = panel.getAttribute("data-domain");
      categoryButtonMap[domain] = {};
      panel.querySelectorAll("button").forEach(function (btn) {
        const label = btn.querySelector("span:last-child").textContent.trim();
        const category = companyLabelToCategory[label] || label;
        categoryButtonMap[domain][category] = btn;
        btn.addEventListener("click", function () {
          btn.classList.toggle("is-off");
          const g = groups[domain] && groups[domain][category];
          if (!g) return;
          if (btn.classList.contains("is-off")) {
            map.removeLayer(g);
          } else if (domain === activeDomain) {
            map.addLayer(g);
          }
        });
      });
    });

    // 눈 모양 "모두 끄기/켜기" 버튼: 패널마다 맨 위에 하나씩. 하나라도 켜져 있으면 전부 끄고, 전부 꺼져 있으면 전부 켠다.
    categoryGroups.forEach(function (panel) {
      const domain = panel.getAttribute("data-domain");
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "cat-all-toggle";
      panel.insertBefore(allBtn, panel.firstChild);

      function catButtons() {
        return Array.prototype.filter.call(panel.querySelectorAll("button"), function (b) { return b !== allBtn; });
      }
      function refreshAllBtn() {
        const anyOn = catButtons().some(function (b) { return !b.classList.contains("is-off"); });
        allBtn.innerHTML = anyOn
          ? '<span class="icon"><img src="/static/ico/pack_2/15_eye_open.png" alt=""></span><span>모두 끄기</span>'
          : '<span class="icon"><img src="/static/ico/pack_2/16_eye_closed.png" alt=""></span><span>모두 켜기</span>';
        allBtn.setAttribute("aria-label", anyOn ? "모두 끄기" : "모두 켜기");
      }
      allBtn.addEventListener("click", function () {
        const turnOff = catButtons().some(function (b) { return !b.classList.contains("is-off"); });
        // 버튼이 없는 카테고리(예: 핫플의 기타)도 포함해 이 영역의 모든 레이어를 켜고 끈다.
        Object.keys(categoryButtonMap[domain]).forEach(function (category) {
          categoryButtonMap[domain][category].classList.toggle("is-off", turnOff);
        });
        Object.keys(groups[domain] || {}).forEach(function (category) {
          const g = groups[domain][category];
          if (turnOff) map.removeLayer(g);
          else if (domain === activeDomain) map.addLayer(g);
        });
        refreshAllBtn();
      });
      // 개별 버튼을 눌러도, 검색으로 이동해도 글자가 맞게 바뀌도록 클래스 변경을 지켜본다.
      new MutationObserver(refreshAllBtn).observe(panel, { subtree: true, attributes: true, attributeFilter: ["class"] });
      refreshAllBtn();
    });

    // 주소가 #photos-food / #photos-fun 이면 갤러리를 바로 연다
    const photosHash = /^#photos-(food|fun|event|pretty|tips)$/.exec(location.hash);
    if (photosHash) showGallery(photosHash[1]);

    // ===== 검색 =====
    const searchInput = document.getElementById("search-input");
    const placeListEl = document.getElementById("place-list");
    const placeListTitleEl = document.getElementById("place-list-title");
    const placeListDefaultHtml = placeListEl.innerHTML;
    const placeListDefaultTitle = placeListTitleEl.textContent;

    function normalize(s) {
      return String(s || "").toLowerCase().replace(/\s+/g, "").trim();
    }

    // 회사와 핫플을 함께 찾는다. 현재 선택한 영역의 결과를 앞에 둔다.
    function findPlaces(query) {
      const q = normalize(query);
      if (!q) return [];
      // 태그 필터가 켜져 있으면 그 안에서만 이름과 주소를 찾는다(다른 곳은 지도에서 숨겨져 있다).
      const pool = tagFilter ? placeIndex.filter(function (p) { return itemHasTag(p, tagFilter.tag); }) : placeIndex;
      function byActiveFirst(list) {
        return list.slice().sort(function (a, b) {
          return (b.domain === activeDomain) - (a.domain === activeDomain);
        });
      }
      const exact = pool.filter(function (p) { return normalize(p.name) === q; });
      if (exact.length) return byActiveFirst(exact);
      const byName = pool.filter(function (p) { return normalize(p.name).indexOf(q) !== -1; });
      if (byName.length) return byActiveFirst(byName);
      // 태그로 찾기: "의정부 명소"처럼 노션 태그와 같은 말을 치면 그 태그가 붙은 곳을 모두 보여 준다.
      const byTag = placeIndex.filter(function (p) {
        return (p.tags || []).some(function (t) { return normalize(t) === q; });
      });
      if (byTag.length) {
        const r = byActiveFirst(byTag);
        r.byTag = true;
        r.tag = byTag[0].tags.filter(function (t) { return normalize(t) === q; })[0];
        return r;
      }
      return byActiveFirst(pool.filter(function (p) { return normalize(p.address).indexOf(q) !== -1; }));
    }

    // ----- 태그 필터 -----
    const tagChip = document.createElement("div");
    tagChip.id = "tag-filter-chip";
    // 자리를 늘 확보해서(높이 고정) 켜고 끌 때 아래 화면이 출렁이지 않게 한다. 꺼져 있을 때는 안내 글만 보인다.
    tagChip.style.cssText = "padding:0 16px 12px;background:#ff8a3d";
    tagChip.innerHTML = '<div class="tag-pill" style="box-sizing:border-box;height:32px;padding:0 10px;border-radius:999px;background:transparent;border:1px solid transparent;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:rgba(255,255,255,.75)"><span class="tag-chip-text"></span><button type="button" aria-label="필터 끄기" style="display:none;border:0;background:transparent;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0 2px">✕</button></div>';
    const tagPill = tagChip.querySelector(".tag-pill");
    const tagChipText = tagChip.querySelector(".tag-chip-text");
    const tagChipBtn = tagChip.querySelector("button");
    function setTagChip(text) {
      const on = !!text;
      tagChipText.textContent = on ? text : "태그로 모아 보기 · 예) 의정부 명소";
      tagPill.style.borderColor = on ? "rgba(255,255,255,.85)" : "transparent";
      tagPill.style.color = on ? "#fff" : "rgba(255,255,255,.75)";
      tagPill.style.fontSize = on ? "13px" : "12px";
      tagPill.style.fontWeight = on ? "600" : "400";
      tagChipBtn.style.display = on ? "" : "none";
    }
    setTagChip("");
    document.querySelector(".sidebar__search").insertAdjacentElement("afterend", tagChip);
    tagChipBtn.addEventListener("click", clearTagFilter);

    function applyTagFilter(found) {
      const tag = found.tag;
      const changed = !tagFilter || normalize(tagFilter.tag) !== normalize(tag);
      if (!tagFilter) {
        const saved = [];
        Object.keys(categoryButtonMap).forEach(function (d) {
          Object.keys(categoryButtonMap[d]).forEach(function (c) {
            const b = categoryButtonMap[d][c];
            saved.push([b, b.classList.contains("is-off")]);
          });
        });
        tagFilter = { tag: tag, saved: saved };
      } else {
        tagFilter.tag = tag;
      }
      const matched = placeIndex.filter(function (p) { return itemHasTag(p, tag); });
      placeIndex.forEach(function (p) {
        if (itemHasTag(p, tag)) p.group.addLayer(p.marker); else p.group.removeLayer(p.marker);
      });
      // 그 장소들의 카테고리 버튼은 켜고, 가장 많은 영역(회사/핫플)으로 옮긴다.
      const count = {};
      matched.forEach(function (p) {
        count[p.domain] = (count[p.domain] || 0) + 1;
        const b = categoryButtonMap[p.domain] && categoryButtonMap[p.domain][p.category];
        if (b) b.classList.remove("is-off");
      });
      const domain = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; })[0] || activeDomain;
      setDomain(domain, true);
      if (changed && matched.length) {
        map.fitBounds(L.latLngBounds(matched.filter(function (p) { return p.domain === domain; }).map(function (p) { return [p.lat, p.lon]; })), { padding: [40, 40], maxZoom: 15 });
      }
      setTagChip("📍 " + tag + "만 보는 중 (" + matched.length + "곳)");
    }

    function clearTagFilter() {
      if (!tagFilter) return;
      const saved = tagFilter.saved;
      tagFilter = null;
      placeIndex.forEach(function (p) { p.group.addLayer(p.marker); });
      saved.forEach(function (s) { s[0].classList.toggle("is-off", s[1]); });
      applyDomainVisibility(activeDomain);
      setTagChip("");
    }

    function blinkMarker(marker) {
      const el = marker.getElement && marker.getElement();
      if (!el) return;
      el.classList.remove("blink-marker");
      void el.offsetWidth;
      el.classList.add("blink-marker");
    }

    function goToPlace(item) {
      if (item.domain !== activeDomain) setDomain(item.domain, true);
      if (item.group && !map.hasLayer(item.group)) map.addLayer(item.group);
      const btn = categoryButtonMap[item.domain] && categoryButtonMap[item.domain][item.category];
      if (btn) btn.classList.remove("is-off");
      map.flyTo([item.lat, item.lon], 17, { duration: 0.85 });
      setTimeout(function () {
        item.marker.openPopup();
        blinkMarker(item.marker);
      }, 900);
    }

    let addressPinMarker = null;

    function clearAddressPin() {
      if (addressPinMarker) { map.removeLayer(addressPinMarker); addressPinMarker = null; }
    }

    function clearSearchResults() {
      placeListEl.innerHTML = placeListDefaultHtml;
      placeListTitleEl.textContent = placeListDefaultTitle;
      clearAddressPin();
    }

    function showSearchMessage(text) {
      placeListTitleEl.textContent = "검색 결과";
      placeListEl.innerHTML = "";
      const li = document.createElement("li");
      li.className = "sidebar__list-empty";
      li.textContent = text;
      placeListEl.appendChild(li);
    }

    async function searchByAddress(query) {
      showSearchMessage("주소를 찾는 중...");
      let data;
      try {
        const res = await fetch("/api/geocode?address=" + encodeURIComponent(query));
        data = await res.json();
        if (!res.ok) throw new Error(data.error || "주소를 찾지 못했습니다.");
      } catch (err) {
        showSearchMessage(err.message || "주소를 찾지 못했습니다.");
        return;
      }

      clearAddressPin();
      addressPinMarker = L.marker([data.lat, data.lon]).addTo(map);
      addressPinMarker.bindPopup(escapeHtml(query)).openPopup();
      map.flyTo([data.lat, data.lon], 17, { duration: 0.85 });
      showSearchMessage(query + " 위치를 찾았습니다.");
    }

    function renderSearchResults(items) {
      placeListTitleEl.textContent = "검색 결과 (" + items.length + "건)";
      placeListEl.innerHTML = "";
      if (!items.length) {
        const li = document.createElement("li");
        li.className = "sidebar__list-empty";
        li.textContent = "검색 결과가 없습니다.";
        placeListEl.appendChild(li);
        return;
      }
      // 같은 이름이 여러 개면 카테고리와 주소로 구분해서 고르게 한다.
      const nameCount = {};
      items.forEach(function (item) { const k = normalize(item.name); nameCount[k] = (nameCount[k] || 0) + 1; });
      items.forEach(function (item) {
        const li = document.createElement("li");
        li.className = "sidebar__list-item";
        const dup = nameCount[normalize(item.name)] > 1;
        li.innerHTML =
          '<div class="sidebar__list-item-row">' +
            '<span class="sidebar__list-item-name">' + escapeHtml(item.name) + "</span>" +
            favStarHtml(item.id) +
          "</div>" +
          '<span class="sidebar__list-item-addr">' + '<b class="sidebar__list-item-domain sidebar__list-item-domain--' + item.domain + '">' + (item.domain === "company" ? "회사" : "핫플") + "</b> " +
            (dup ? '<b class="sidebar__list-item-dup">같은 이름</b> ' : "") +
            escapeHtml(item.category) + " · " + escapeHtml(item.address) + "</span>" +
          (item.url ? '<a class="sidebar__list-item-link" href="' + escapeHtml(item.url) +
            '" target="_blank" rel="noopener">자세히 보기</a>' : "");
        li.addEventListener("click", function () { goToPlace(item); });
        const star = li.querySelector(".fav-star");
        star.addEventListener("click", function (e) { e.stopPropagation(); toggleFavorite(item); });
        const link = li.querySelector(".sidebar__list-item-link");
        if (link) link.addEventListener("click", function (e) { e.stopPropagation(); });
        placeListEl.appendChild(li);
      });
    }

    searchInput.addEventListener("input", function () {
      const q = searchInput.value.trim();
      clearAddressPin();
      if (!q) { clearSearchResults(); return; }
      const found = findPlaces(q);
      renderSearchResults(found);
      if (found.byTag) applyTagFilter(found);
    });

    searchInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (!q) return;
        const found = findPlaces(q);
        if (found.byTag) {
          // 태그 검색: 첫 번째로 날아가지 않고 목록에서 고르게 한다.
          renderSearchResults(found);
          placeListTitleEl.textContent = q + " " + found.length + "곳 - 아래에서 선택하세요";
          applyTagFilter(found);
        } else if (found.length > 1 && found.every(function (f) { return normalize(f.name) === normalize(found[0].name); })) {
          // 이름이 같은 곳이 여러 개: 임의로 첫 번째로 가지 않고 목록에서 고르게 한다.
          renderSearchResults(found);
          placeListTitleEl.textContent = "같은 이름 " + found.length + "곳 - 아래에서 선택하세요";
        } else if (found.length) {
          goToPlace(found[0]);
        } else {
          searchByAddress(q);
        }
      } else if (e.key === "Escape") {
        clearSearchResults();
      }
    });

    // ===== 경계선(행정동) =====
    const BOUNDARY_COLORS = [
      { fill: "#3388ff", line: "#1a4f99" },
      { fill: "#e67e00", line: "#a85a00" },
      { fill: "#27ae60", line: "#1e8449" },
      { fill: "#8e44ad", line: "#6c3483" },
      { fill: "#c0392b", line: "#922b21" },
      { fill: "#16a085", line: "#0e6655" },
    ];

    async function setupBoundaries() {
      let list = [];
      try {
        const res = await fetch("/api/boundaries");
        if (res.ok) {
          const data = await res.json();
          list = data.boundaries || [];
        }
      } catch (err) {
        console.warn("경계 목록을 불러오지 못했습니다.", err);
        return;
      }
      if (!list.length) return;

      const loadedUrls = {};

      list.forEach(function (item, i) {
        const color = BOUNDARY_COLORS[i % BOUNDARY_COLORS.length];
        const layer = L.layerGroup();
        // 체크박스로 처음 켤 때만 실제 geojson을 내려받는다 (17개 전부 미리 받으면 너무 무거움).
        layer.on("add", function () {
          if (loadedUrls[item.url]) return;
          loadedUrls[item.url] = true;
          fetch(item.url)
            .then(function (r) { return r.json(); })
            .then(function (geo) {
              L.geoJSON(geo, {
                style: { fillColor: color.fill, color: color.line, weight: 2, fillOpacity: 0.08 },
              }).addTo(layer);
            })
            .catch(function (err) {
              console.warn("경계 로드 실패:", item.url, err);
              delete loadedUrls[item.url];
            });
        });
        layerControl.addOverlay(layer, item.name);

        // 기본값: 서울만 켜둔다.
        if (item.filename && item.filename.indexOf("서울") !== -1) {
          map.addLayer(layer);
        }
      });
    }

    // ===== 등록 =====
    const registerDomainButtons = document.querySelectorAll("#register-domain-toggle button");
    const registerCategorySelect = document.getElementById("reg-category");
    const registerForm = document.getElementById("register-form");
    const registerMsgEl = document.getElementById("register-msg");
    const registerSubmitBtn = document.getElementById("register-submit");
    let registerDomain = document.querySelector("#register-domain-toggle button.active").getAttribute("data-domain");

    function updateRegisterTabCount() {
      const count = placeIndex.filter(function (p) { return p.domain === registerDomain; }).length;
      updateTabCount("tab-register", "등록", count);
    }

    function registerCategoriesFor(domain) {
      return domain === "company" ? Object.keys(companyIconEmoji) : Object.keys(hotspotIconFiles);
    }

    function populateRegisterCategories(domain) {
      registerCategorySelect.innerHTML = "";
      registerCategoriesFor(domain).forEach(function (cat) {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        registerCategorySelect.appendChild(opt);
      });
    }

    populateRegisterCategories(registerDomain);

    registerDomainButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        registerDomainButtons.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        registerDomain = btn.getAttribute("data-domain");
        populateRegisterCategories(registerDomain);
        updateRegisterTabCount();
      });
    });

    function setRegisterMsg(text, kind) {
      registerMsgEl.textContent = text || "";
      registerMsgEl.className = "register-msg" + (kind ? " is-" + kind : "");
    }

    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      const regId = document.getElementById("reg-id").value.trim();
      const name = document.getElementById("reg-name").value.trim();
      const owner = document.getElementById("reg-owner").value.trim();
      const address = document.getElementById("reg-address").value.trim();
      const category = registerCategorySelect.value;
      const phone = document.getElementById("reg-contact").value.trim();
      const memo = document.getElementById("reg-memo").value.trim();

      if (!name || !address) {
        setRegisterMsg("상호와 주소를 입력해주세요.", "error");
        return;
      }

      registerSubmitBtn.disabled = true;
      setRegisterMsg("등록 중...", "");

      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          domain: registerDomain, regId: regId, name: name, owner: owner, address: address,
          category: category, phone: phone, memo: memo,
        }),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok) {
            setRegisterMsg(result.body.error || "등록에 실패했습니다.", "error");
            return;
          }
          addPlaceMarker(result.body.place);
          if (registerDomain === activeDomain) applyDomainVisibility(activeDomain);
          setRegisterMsg(name + " 등록되었습니다!", "ok");
          registerForm.reset();
          populateRegisterCategories(registerDomain);
        })
        .catch(function () {
          setRegisterMsg("등록 중 오류가 발생했습니다.", "error");
        })
        .finally(function () {
          registerSubmitBtn.disabled = false;
        });
    });

    initMap();
    // 즐겨찾기 그리기에서 오류가 나도 아래의 햄버거 버튼 연결까지 멈추지 않게 한다.
    try { renderFavoritesPanel(); } catch (err) { console.warn("즐겨찾기를 그리지 못했습니다.", err); }

    // 사이드바 열기/닫기 (book 페이지와 동일): 햄버거 버튼으로 토글, 모바일에서는 어두운 배경을 누르면 닫힌다.
    const sidebarToggle = document.getElementById("sidebar-toggle");
    const sidebarBackdrop = document.getElementById("sidebar-backdrop");

    // 사이드바 폭이 0.2초 동안 줄어드는 동안 지도 크기를 매 프레임 맞춘다.
    // (끝난 뒤에 한 번만 맞추면 마지막에 지도가 움찔한다)
    function refreshMapSize() {
      const start = performance.now();
      function step(now) {
        if (map) map.invalidateSize({ animate: false });
        if (now - start < 260) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    sidebarToggle.addEventListener("click", function () {
      document.body.classList.toggle("sidebar-collapsed");
      refreshMapSize();
    });

    sidebarBackdrop.addEventListener("click", function () {
      document.body.classList.add("sidebar-collapsed");
      refreshMapSize();
    });

    // ===== 광고 배너 (3초 간격 자동 전환) =====
    (function () {
      const images = [
        "/static/img/adv/1_한샘아트웍.png",
        "/static/img/adv/2_우로봇.png",
        "/static/img/adv/3_티렌.png",
      ];
      const img = document.getElementById("ad-banner-img");
      if (!img || images.length === 0) return;

      let idx = 0;
      img.src = images[idx];

      setInterval(function () {
        idx = (idx + 1) % images.length;
        img.style.opacity = 0;
        setTimeout(function () {
          img.src = images[idx];
          img.style.opacity = 1;
        }, 300);
      }, 3000);
    })();

    // ===== 지도 위 광고 배너 (3초 간격 자동 전환) =====
    (function () {
      const images = [
        "/static/img/adv/4_마우저.jpg",
        "/static/img/adv/5_디지키.jpg",
      ];
      const img = document.getElementById("map-ad-banner-img");
      if (!img || images.length === 0) return;

      let idx = 0;
      img.src = images[idx];

      setInterval(function () {
        idx = (idx + 1) % images.length;
        img.style.opacity = 0;
        setTimeout(function () {
          img.src = images[idx];
          img.style.opacity = 1;
        }, 300);
      }, 3000);
    })();
  </script>
